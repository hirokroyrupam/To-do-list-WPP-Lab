<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Interactive To-Do List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-12">

    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 dark:border-slate-700/60 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-brand-500/10 text-brand-500 rounded-xl">
                    <i class="fa-solid fa-square-check text-2xl sm:text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-500 to-indigo-600 dark:to-indigo-400">TaskFlow</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Stay organized and productive</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="themeToggle" aria-label="Toggle dark mode" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/70 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 mt-6 sm:mt-8">
        
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-700/60 mb-6 sm:mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                    <h2 class="text-lg font-semibold">Task Overview</h2>
                    <p id="statsText" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">0 of 0 tasks completed</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="completionPercent" class="text-2xl font-bold text-brand-500">0%</span>
                </div>
            </div>

            <div class="w-full bg-slate-100 dark:bg-slate-700/60 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-200/50 dark:border-slate-600/50">
                <div id="progressBar" class="progress-bar-fill bg-gradient-to-r from-brand-500 to-indigo-500 h-full rounded-full w-0"></div>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-700/60 mb-6 sm:mb-8">
            <form id="taskForm" class="space-y-4">
                <div class="space-y-3">
                    <div>
                        <label for="taskInput" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Task Title <span class="text-red-500">*</span></label>
                        <input type="text" id="taskInput" placeholder="What needs to be done?" required
                            class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-sm font-medium">
                    </div>
                    <div>
                        <label for="taskDesc" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Description / Notes <span class="text-slate-400 font-normal">(Optional)</span></label>
                        <textarea id="taskDesc" rows="2" placeholder="Add extra details, notes, or steps..."
                            class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs sm:text-sm resize-none"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-1 items-end">
                    <div>
                        <label for="taskPriority" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
                        <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-slate-200">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                    </div>

                    <div>
                        <label for="taskCategory" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Category</label>
                        <select id="taskCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-slate-200">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Fitness">Fitness</option>
                            <option value="Ideas">Ideas</option>
                        </select>
                    </div>

                    <div>
                        <label for="taskDueDate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
                        <div class="relative">
                            <input type="text" id="taskDueDate" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}" title="Enter a date as DD/MM/YYYY" class="w-full px-3 py-2 pr-10 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-slate-200">
                            <button type="button" id="openCalendarBtn" aria-label="Open calendar" title="Choose due date" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
                                <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                            </button>
                            <input type="date" id="taskDueDatePicker" aria-label="Choose due date" tabindex="-1" class="sr-only">
                        </div>
                    </div>

                    <div>
                        <button type="submit" 
                            class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium rounded-xl shadow-md shadow-brand-500/25 hover:shadow-brand-500/40 transition-all flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-brand-500 active:scale-[0.98]">
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>Add Task</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center mb-6">
            <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs sm:text-sm font-medium border border-slate-200/50 dark:border-slate-700/50">
                <button data-filter="all" class="filter-tab flex-1 sm:flex-initial px-4 py-2 rounded-lg transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white active">All</button>
                <button data-filter="active" class="filter-tab flex-1 sm:flex-initial px-4 py-2 rounded-lg transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Active</button>
                <button data-filter="completed" class="filter-tab flex-1 sm:flex-initial px-4 py-2 rounded-lg transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Completed</button>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1 sm:w-60">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Search tasks..." class="w-full pl-9 pr-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white placeholder-slate-400">
                </div>

                <select id="priorityFilter" class="px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-slate-200">
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
            </div>
        </div>

        <div id="taskList" class="space-y-3"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center bg-white dark:bg-slate-800/40 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
            <div class="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 dark:text-slate-500 text-2xl">
                <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">No tasks found</h3>
            <p class="text-xs sm:text-sm text-slate-400 dark:text-slate-500 max-w-xs mt-1">Get started by adding a new task or resetting your filters.</p>
        </div>

        <div class="mt-6 flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm text-slate-500 dark:text-slate-400 pt-4 border-t border-slate-200 dark:border-slate-800">
            <span id="activeCount">0 items left</span>
            <div class="flex items-center space-x-4">
                <button id="clearCompletedBtn" class="hover:text-red-500 transition-colors focus:outline-none">Clear Completed</button>
                <button id="clearAllBtn" class="hover:text-red-500 transition-colors focus:outline-none">Clear All</button>
            </div>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
            <h3 class="text-lg font-bold text-slate-800 dark:text-white">Edit Task</h3>
            <div>
                <label for="editTaskInput" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Task Title</label>
                <input type="text" id="editTaskInput" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-white text-sm">
            </div>
            <div>
                <label for="editTaskDesc" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Description / Notes</label>
                <textarea id="editTaskDesc" rows="2" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-white text-xs sm:text-sm resize-none"></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="editPriority" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
                    <select id="editPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-white">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div>
                    <label for="editCategory" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Category</label>
                    <select id="editCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-white">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Ideas">Ideas</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="editTaskDueDate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
                <div class="relative">
                    <input type="text" id="editTaskDueDate" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}" title="Enter a date as DD/MM/YYYY" class="w-full px-3 py-2 pr-10 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-white">
                    <button type="button" id="editOpenCalendarBtn" aria-label="Open calendar" title="Choose due date" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
                        <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                    </button>
                    <input type="date" id="editTaskDueDatePicker" aria-label="Choose due date" tabindex="-1" class="sr-only">
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-2">
                <button id="cancelEditBtn" class="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-medium">Cancel</button>
                <button id="saveEditBtn" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-medium shadow-md shadow-brand-500/20">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-800 dark:bg-slate-700 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all transform translate-y-20 opacity-0">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm">Task added successfully!</span>
    </div>

    <!-- JavaScript App File -->
    <script src="app.js"></script>
</body>
</html>
